version: '3.8'

services:
  db:
    image: postgres:15
    container_name: avana-db
    restart: always
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-avana_rma}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - avana-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avana-backend
    restart: always
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - uploads:/app/uploads
    tmpfs:
      - /app/logs
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-avana_rma}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      CORS_ORIGIN: '*'
      NODE_ENV: production
    networks:
      - avana-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: avana-frontend
    restart: always
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - avana-net

volumes:
  pgdata:
  uploads:

networks:
  avana-net:
    driver: bridge
